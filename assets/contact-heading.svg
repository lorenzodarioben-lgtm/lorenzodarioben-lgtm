<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="88"
  viewBox="0 0 900 88"
  preserveAspectRatio="xMinYMid meet"
  role="img"
  aria-labelledby="contact-title contact-description"
>
  <title id="contact-title">Contact</title>

  <desc id="contact-description">
    Contact heading with an available-to-connect status, animated
    communication packets, signal nodes, and a responsive beacon.
  </desc>

  <defs>
    <!-- Main contact colour sequence -->
    <linearGradient
      id="contact-gradient"
      x1="0"
      y1="0"
      x2="900"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="52%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Softer glow used around the travelling signal -->
    <filter
      id="contact-glow"
      x="-20%"
      y="-300%"
      width="140%"
      height="700%"
    >
      <feGaussianBlur
        stdDeviation="2.3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow for the online indicator -->
    <filter
      id="status-glow"
      x="-250%"
      y="-250%"
      width="600%"
      height="600%"
    >
      <feGaussianBlur
        stdDeviation="2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .heading {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      font-size: 24px;
      font-weight: 600;
      fill: #1f2328;
    }

    .status-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.25px;
      fill: #0969da;
    }

    .footer-text {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
      font-size: 8.5px;
      letter-spacing: 0.9px;
      fill: #57606a;
    }

    .base-track {
      stroke: #d0d7de;
    }

    .panel {
      fill: #f6f8fa;
      stroke: #d0d7de;
    }

    .node {
      fill: #ffffff;
      stroke: #d0d7de;
    }

    .envelope {
      fill: none;
      stroke: #57606a;
    }

    @media (prefers-color-scheme: dark) {
      .heading {
        fill: #f0f6fc;
      }

      .status-text {
        fill: #58a6ff;
      }

      .footer-text {
        fill: #8b949e;
      }

      .base-track {
        stroke: #30363d;
      }

      .panel {
        fill: #161b22;
        stroke: #30363d;
      }

      .node {
        fill: #0d1117;
        stroke: #30363d;
      }

      .envelope {
        stroke: #8b949e;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .moving-pulse,
      .packet,
      .ping-ring,
      .signal-animation {
        display: none;
      }
    }
  </style>

  <!-- Main heading -->
  <text
    class="heading"
    x="0"
    y="30"
  >Contact</text>

  <!-- Availability status panel -->
  <rect
    class="panel"
    x="118"
    y="7"
    width="211"
    height="27"
    rx="13.5"
    stroke-width="1"
  />

  <!-- Online indicator -->
  <circle
    cx="138"
    cy="20.5"
    r="4"
    fill="#14b8a6"
    filter="url(#status-glow)"
  >
    <animate
      class="signal-animation"
      attributeName="opacity"
      values="0.4;1;0.4"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    class="signal-animation"
    cx="138"
    cy="20.5"
    r="4"
    fill="none"
    stroke="#14b8a6"
    stroke-width="1"
  >
    <animate
      attributeName="r"
      values="4;8;11"
      dur="2.1s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.55;0.15;0"
      dur="2.1s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    class="status-text"
    x="153"
    y="24.5"
  >AVAILABLE TO CONNECT</text>

  <!-- Signal-strength indicator -->
  <g transform="translate(850 9)">
    <rect
      x="0"
      y="15"
      width="5"
      height="7"
      rx="2"
      fill="#14b8a6"
    >
      <animate
        class="signal-animation"
        attributeName="opacity"
        values="0.35;1;0.35"
        dur="1.8s"
        begin="0s"
        repeatCount="indefinite"
      />
    </rect>

    <rect
      x="11"
      y="10"
      width="5"
      height="12"
      rx="2"
      fill="#60a5fa"
    >
      <animate
        class="signal-animation"
        attributeName="opacity"
        values="0.35;1;0.35"
        dur="1.8s"
        begin="0.25s"
        repeatCount="indefinite"
      />
    </rect>

    <rect
      x="22"
      y="4"
      width="5"
      height="18"
      rx="2"
      fill="#f59e0b"
    >
      <animate
        class="signal-animation"
        attributeName="opacity"
        values="0.35;1;0.35"
        dur="1.8s"
        begin="0.5s"
        repeatCount="indefinite"
      />
    </rect>
  </g>

  <!-- Main GitHub-style underline -->
  <line
    class="base-track"
    x1="0"
    y1="62"
    x2="900"
    y2="62"
    stroke-width="1.4"
  />

  <!-- Secondary communications track -->
  <line
    class="base-track"
    x1="0"
    y1="67"
    x2="900"
    y2="67"
    stroke-width="1"
    opacity="0.48"
  />

  <!-- Left transmission node -->
  <circle
    class="node"
    cx="18"
    cy="62"
    r="6"
    stroke-width="1.2"
  />

  <circle
    cx="18"
    cy="62"
    r="2.7"
    fill="#14b8a6"
  >
    <animate
      class="signal-animation"
      attributeName="opacity"
      values="0.35;1;0.35"
      dur="1.7s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Central relay node -->
  <circle
    class="node"
    cx="462"
    cy="62"
    r="7"
    stroke-width="1.2"
  />

  <circle
    cx="462"
    cy="62"
    r="3"
    fill="#60a5fa"
  >
    <animate
      class="signal-animation"
      attributeName="opacity"
      values="0.3;1;0.3"
      dur="1.8s"
      begin="0.35s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Small relay branches -->
  <path
    class="base-track"
    d="M462 55 V48 H482"
    fill="none"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle
    class="node"
    cx="486"
    cy="48"
    r="4"
    stroke-width="1"
  />

  <circle
    cx="486"
    cy="48"
    r="1.8"
    fill="#60a5fa"
  />

  <!-- Right communication hub -->
  <circle
    class="node"
    cx="824"
    cy="62"
    r="12"
    stroke-width="1.2"
  />

  <!-- Envelope icon inside hub -->
  <rect
    class="envelope"
    x="817"
    y="57.5"
    width="14"
    height="9"
    rx="1.5"
    stroke-width="1.2"
  />

  <path
    class="envelope"
    d="M818 58.5 L824 63 L830 58.5"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Expanding signal rings -->
  <circle
    class="ping-ring"
    cx="824"
    cy="62"
    r="12"
    fill="none"
    stroke="#f59e0b"
    stroke-width="1.5"
  >
    <animate
      attributeName="r"
      values="12;21;29"
      dur="2.4s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.55;0.18;0"
      dur="2.4s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    class="ping-ring"
    cx="824"
    cy="62"
    r="12"
    fill="none"
    stroke="#60a5fa"
    stroke-width="1.4"
  >
    <animate
      attributeName="r"
      values="12;20;27"
      dur="2.4s"
      begin="0.75s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.45;0.14;0"
      dur="2.4s"
      begin="0.75s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Moving gradient signal -->
  <line
    class="moving-pulse"
    x1="0"
    y1="62"
    x2="900"
    y2="62"
    stroke="url(#contact-gradient)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-dasharray="120 1055"
    filter="url(#contact-glow)"
  >
    <animate
      attributeName="stroke-dashoffset"
      values="1175;0"
      dur="3.9s"
      repeatCount="indefinite"
    />
  </line>

  <!-- Travelling message packet 1 -->
  <circle
    class="packet"
    cx="0"
    cy="0"
    r="3"
    fill="#14b8a6"
    filter="url(#contact-glow)"
  >
    <animateMotion
      path="M36 67 L795 67"
      dur="4.8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.1;0.85;1"
      dur="4.8s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Travelling message packet 2 -->
  <circle
    class="packet"
    cx="0"
    cy="0"
    r="2.8"
    fill="#60a5fa"
    filter="url(#contact-glow)"
  >
    <animateMotion
      path="M170 62 L806 62"
      dur="4.8s"
      begin="1.1s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.1;0.85;1"
      dur="4.8s"
      begin="1.1s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Travelling message packet 3 -->
  <circle
    class="packet"
    cx="0"
    cy="0"
    r="2.6"
    fill="#f59e0b"
    filter="url(#contact-glow)"
  >
    <animateMotion
      path="M320 67 L812 67"
      dur="4.8s"
      begin="2.2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.1;0.85;1"
      dur="4.8s"
      begin="2.2s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Contact methods -->
  <text
    class="footer-text"
    x="0"
    y="84"
  >EMAIL • LINKEDIN • LEETCODE • PORTFOLIO</text>
</svg>